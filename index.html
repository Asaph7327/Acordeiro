<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acordeiro</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17151f"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#17151f;--shell:#e7e0f3;--key:#fbf9ff;--ink:#202420;--hit:#cfe8c6;--screen:#0d1c17;--glow:#a9e8bd;--text:#eef0ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:430px;margin:auto;padding:12px}
h1{font-size:1rem;text-align:center;margin-bottom:10px}
.device{background:var(--shell);color:var(--ink);padding:12px;border-radius:24px;box-shadow:0 6px 0 #aaa590}
.top{display:flex;gap:10px}
#joy{position:relative;flex:0 0 124px;height:124px;border-radius:50%;background:radial-gradient(#111 55%,#383a36 57%,#d5d1c1 60%);touch-action:none;cursor:grab}
#joy span{position:absolute;font-size:.6rem;font-weight:800;pointer-events:none}
.u,.d{left:0;right:0;text-align:center}.u{top:5px}.d{bottom:5px}.l,.r{top:55px}.l{left:2px}.r{right:6px}
#knob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9b6a8);box-shadow:0 4px 8px #000a}
.screen{flex:1;min-width:0;display:flex;align-items:center;background:var(--screen);color:var(--glow);border:4px solid #272b27;border-radius:12px;padding:6px}
canvas{width:58%;height:90px}
.info{flex:1;min-width:0;text-align:center}
#now{display:block;font-size:1.35rem;font-weight:600;overflow-wrap:anywhere}
#pads{display:grid;grid-template-columns:repeat(8,1fr);gap:8px 6px;margin-top:14px;touch-action:none}
button,select{font:600 .85rem Rubik,system-ui,sans-serif;border:1px solid #0003;border-radius:9px;padding:11px 3px;background:var(--key);color:var(--ink);box-shadow:0 4px 0 #8d8979}
button[aria-pressed=true],.pad.on{background:var(--hit);transform:translateY(3px);box-shadow:0 1px 0 #8d8979}
.pad{grid-column:span 2;height:96px;font-size:1rem;overflow:hidden;touch-action:none}
.pad:nth-child(5){grid-column:2/span 2}
.pad small{display:block;font-size:.7rem;font-weight:400}
:focus-visible{outline:3px solid #ffc93c;outline-offset:2px}
.row{display:flex;gap:7px;margin:12px 0}
.row>*{flex:1;min-width:0}
.colors select{text-align:center}
#bKey{background:#7ee8d8}#bSound{background:#93caf5}#bMode{background:#ffa8dc}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}header button{flex:none;width:44px}
.screen{position:relative}.screen em{position:absolute;top:3px;left:8px;font-size:.65rem;font-style:normal}
dialog{width:min(94vw,400px);max-height:85%;margin:auto;border:0;border-radius:18px;padding:16px;background:var(--shell);color:var(--ink)}
dialog::backdrop{background:#000a}dialog form{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
dialog h3{font-size:.95rem;margin-top:16px}dialog p{font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}#octTxt{align-self:center;text-align:center}

.bpm{align-self:center;text-align:center;font-size:.75rem}
label{display:block;font-size:.8rem}
input{width:100%;accent-color:#6f9c7c;height:30px}
summary{padding:10px 0;font-weight:600}
#pop{position:fixed;z-index:20;left:50%;transform:translateX(-50%);width:min(96vw,400px);overflow-y:auto;overscroll-behavior:contain;padding:10px;border-radius:16px;background:#17151f;color:#fff;box-shadow:0 8px 30px #000c}
#pop[hidden]{display:none}#pop .row{margin:0 0 8px}#pop b{align-self:center;font-size:1.1rem}
#types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px 5px;padding-bottom:5px}#types button{padding:10px 1px}
</style></head><body>
<main>
<header><h1>Acordeiro</h1><button data-open="dCfg" aria-label="Configurações">⚙️</button></header>
<div class="device">
<div class="top">
<div id="joy" role="group" aria-label="Controle de variação. Use as setas."  tabindex="0"><span class="u">M⇄m</span><span class="r">maj7</span><span class="d">sus4</span><span class="l">dim</span><span style="top:20px;right:15px">7</span><span style="bottom:20px;right:8px">add9</span><span style="bottom:20px;left:18px">6</span><span style="top:20px;left:15px">aug</span><div id="knob"></div></div>
<div class="screen"><em>Sinal</em><canvas id="scope" width="200" height="100" aria-hidden="true"></canvas><div class="info"><span id="now" aria-live="polite">C</span><small id="sound">Névoa</small></div></div>
</div>
<div id="pads"></div>
<div class="row colors"><button id="bKey" data-open="dKey">Tom</button><button id="bSound" data-open="dSound">Timbre</button><button id="bMode" data-open="dMode">Modo</button>
<b class="bpm"><span id="bv">72</span> BPM</b>
</div>
<label>Volume<input id="vol" type="range" min="0" max="100" value="70"></label>
</div>
<div hidden><select id="key"></select><select id="timbre"><option value="nevoa">Névoa</option><option value="piano">Piano</option><option value="warm">Warm Pad</option><option value="shimmer">Shimmer</option><option value="strings">Cordas</option><option value="choir">Coral</option><option value="organ">Órgão Suave</option><option value="pianopad">Piano + Pad</option><option value="atmos">Atmosfera</option><option value="triangle">Suave</option><option value="sine">Sino</option><option value="sawtooth">Synth</option><option value="square">8 bits</option></select><select id="mode"><option value="hold">Segurar</option><option value="latch">Fixar</option><option value="arp">Arpejo</option></select></div>
<dialog id="dKey" aria-label="Tom"><form method="dialog"><h2>Tom</h2><button>Fechar</button></form><div class="grid" id="oKey"></div><div class="row"><select id="scale" aria-label="Escala"><option value="0">Escala maior</option><option value="1">Escala menor</option></select></div><div class="row"><button id="octDown">Oitava −</button><b id="octTxt">Oitava 0</b><button id="octUp">Oitava +</button></div></dialog>
<dialog id="dSound" aria-label="Timbre"><form method="dialog"><h2>Timbre</h2><button>Fechar</button></form><div class="grid" id="oSound"></div></dialog>
<dialog id="dMode" aria-label="Modo"><form method="dialog"><h2>Modo</h2><button>Fechar</button></form><div class="grid" id="oMode"></div></dialog>
<dialog id="dCfg" aria-label="Configurações"><form method="dialog"><h2>Configurações</h2><button>Fechar</button></form><h3>Editar acordes</h3><p>Segure uma tecla ou monte o acorde aqui.</p><p><label><input id="longOn" type="checkbox" style="width:auto;height:auto" checked> Abrir menu ao segurar a tecla</label></p>
<div class="row"><select id="ePad" aria-label="Tecla"></select><select id="eRoot" aria-label="Nota"></select></div>
<div class="row"><select id="eType" aria-label="Tipo"></select><select id="eBass" aria-label="Baixo"></select></div>
<div class="row"><button id="eReset">Restaurar todas as teclas</button></div>
<h3>Acompanhamento</h3><div class="row"><button id="beat" aria-pressed="false">Beat lo-fi</button><button id="drone" aria-pressed="false">Pad contínuo</button></div>
<h3>Texturas</h3><div class="grid" id="tex"></div><h3>Som</h3><label>Ritmo<input id="bpm" type="range" min="50" max="140" value="72"></label><label>Brilho<input id="tone" type="range" min="300" max="8000" value="3000"></label><label>Reverb<input id="rev" type="range" min="0" max="100" value="30"></label><label>Eco<input id="echo" type="range" min="0" max="70" value="15"></label><label>Volume das texturas<input id="tvol" type="range" min="0" max="100" value="50"></label>
</dialog>
</main>
<div id="pop" role="dialog" aria-label="Escolher acorde" hidden><div class="row"><b id="popName"></b><button id="popAuto">Automático</button><button id="popClose">Fechar</button></div><div class="row"><select id="pRoot" aria-label="Nota"></select><select id="pBass" aria-label="Baixo"></select></div><div id="types"></div></div>
<script>
const $=id=>document.getElementById(id);
const N=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
let rvb,ac,master,filt,synth,wet,fb,texBus,an,noise;
function init(){
 if(ac){if(ac.state!=='running')ac.resume();return}
 ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'balanced'});
 const G=v=>{const g=ac.createGain();g.gain.value=v;return g};
 master=G(.7);an=ac.createAnalyser();const comp=ac.createDynamicsCompressor();
 master.connect(comp);comp.connect(an);an.connect(ac.destination);
 filt=ac.createBiquadFilter();filt.type='lowpass';synth=G(1);synth.connect(filt);filt.connect(master);
 const len=Math.floor(ac.sampleRate*1.8),ir=ac.createBuffer(2,len,ac.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
 const cv=ac.createConvolver();cv.buffer=ir;rvb=cv;wet=G(.3);filt.connect(cv);cv.connect(wet);wet.connect(master);
 const dl=ac.createDelay();dl.delayTime.value=.36;fb=G(.15);const out=G(.6);
 filt.connect(fb);fb.connect(dl);const loop=G(.35);dl.connect(loop);loop.connect(dl);dl.connect(out);out.connect(master);
 texBus=G(.5);texBus.connect(master);
 noise=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
 const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 ['vol','tone','rev','echo','tvol'].forEach(apply);draw();
}
function apply(id){if(!ac)return;const v=+$(id).value;
 const p={vol:master.gain,tone:filt.frequency,rev:wet.gain,echo:fb.gain,tvol:texBus.gain}[id];
 p.setTargetAtTime(id==='tone'?v:v/100,ac.currentTime,.03)}
['vol','tone','rev','echo','tvol'].forEach(i=>$(i).oninput=()=>apply(i));
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,type,vol,att){
 if(PADS[type])return padNote(m,t,PADS[type],vol,att);
 const g=ac.createGain(),piano=type==='piano',mist=type==='nevoa';
 const parts=piano?[['triangle',1,1,0],['sine',2,.35,2],['sine',3,.12,3]]:mist?[['sawtooth',1,.28,-9],['sawtooth',1,.28,9],['sine',1,.7,0],['sine',2,.18,5]]:[[type,1,1,Math.random()*8-4]];
 if(mist)att=Math.max(att,.12);if(piano)att=.005;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);if(piano)g.gain.setTargetAtTime(vol*.08,t+att,.7);
 const os=parts.map(([w,r,a,dt])=>{const o=ac.createOscillator(),x=ac.createGain();o.type=w;o.frequency.value=hz(m)*r;o.detune.value=dt;x.gain.value=a;o.connect(x);x.connect(g);o.start(t);return o});
 g.connect(synth);
 os[0].onended=()=>g.disconnect();
 return releaser(g,os,mist?.3:.18,mist?1.6:1.1)}
function hold(p,t){if(p.cancelAndHoldAtTime)p.cancelAndHoldAtTime(t);else p.cancelScheduledValues(t)}
// solta a nota; .kill() encerra na hora para não acumular sons
function releaser(g,os,tc,tail,extra){
 const f=end=>{hold(g.gain,end);g.gain.setTargetAtTime(0,end,tc);os.forEach(o=>o.stop(end+tail));extra&&extra(end)};
 f.kill=()=>{const t=ac.currentTime;hold(g.gain,t);g.gain.setTargetAtTime(0,t,.015);os.forEach(o=>o.stop(t+.09));extra&&extra.kill()};
 return f}
// camadas: [onda, razão da frequência, volume, desafinação]; a=entrada, r=saída, cut=filtro, send=reverb extra
const PADS={
 warm:{a:.5,r:.6,cut:1300,send:.2,l:[['sawtooth',1,.35,-7],['sawtooth',1,.35,7],['sine',.5,.3,0],['triangle',1,.6,0]]},
 shimmer:{a:.7,r:.9,cut:7000,send:.9,l:[['triangle',1,.6,0],['sine',2,.4,6],['sine',2,.4,-6],['sine',4,.1,9]]},
 strings:{a:.6,r:.5,cut:3200,send:.35,vib:7,l:[['sawtooth',1,.5,-11],['sawtooth',1,.5,10],['sawtooth',2,.15,4]]},
 choir:{a:.4,r:.5,cut:850,band:1.6,boost:2.2,send:.5,vib:12,l:[['sawtooth',1,.6,-8],['sawtooth',1,.6,8],['sawtooth',2,.2,3]]},
 organ:{a:.04,r:.1,cut:5000,send:.15,vib:5,l:[['sine',.5,.4,0],['sine',1,.8,0],['sine',2,.4,2],['sine',3,.2,0],['sine',4,.1,0]]},
 pianopad:{a:.6,r:.6,cut:1800,send:.3,piano:true,l:[['sawtooth',1,.25,-8],['sawtooth',1,.25,8],['sine',1,.5,0]]},
 atmos:{a:1.1,r:1.6,cut:2200,send:1,vib:9,l:[['triangle',1,.6,-13],['triangle',1,.6,13],['sine',.5,.35,0],['sine',3,.08,5]]}};
function padNote(m,t,p,vol,att){
 const g=ac.createGain(),f=ac.createBiquadFilter(),s=ac.createGain(),total=p.l.reduce((n,x)=>n+x[2],0);
 f.type=p.band?'bandpass':'lowpass';f.frequency.value=p.cut;f.Q.value=p.band||.7;
 const peak=vol*(p.boost||1),rise=att<.02?att:Math.max(att,p.a);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+rise);
 const lfo=ac.createOscillator(),depth=ac.createGain();lfo.frequency.value=4.6;depth.gain.value=p.vib||0;lfo.connect(depth);lfo.start(t);
 const os=p.l.map(([w,r,a,dt])=>{const o=ac.createOscillator(),x=ac.createGain();o.type=w;o.frequency.value=hz(m)*r;o.detune.value=dt;depth.connect(o.detune);x.gain.value=a/total*1.5;o.connect(x);x.connect(f);o.start(t);return o});
 f.connect(g);g.connect(synth);s.gain.value=p.send;g.connect(s);s.connect(rvb);
 const piano=p.piano?note(m,t,'piano',vol,.005):null;
 os[0].onended=()=>{g.disconnect();s.disconnect();f.disconnect();depth.disconnect()};
 const fast=att<.02;
 return releaser(g,[...os,lfo],fast?.15:p.r*.7,fast?.8:p.r*3,piano)}
const level=()=>['sawtooth','square'].includes($('timbre').value)?.07:.16;
let variation='normal';
const T={'':[0,4,7],m:[0,3,7],'5':[0,7,12],sus2:[0,2,7],sus4:[0,5,7],add4:[0,4,5,7],add9:[0,4,7,14],'6':[0,4,7,9],m6:[0,3,7,9],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],'7sus4':[0,5,7,10],'7♭9':[0,4,7,10,13],'9':[0,4,7,10,14],maj9:[0,4,7,11,14],m9:[0,3,7,10,14],'11':[0,7,10,14,17],m11:[0,3,7,10,17],'13':[0,4,10,14,21],dim:[0,3,6],dim7:[0,3,6,9],'m7♭5':[0,3,6,10],aug:[0,4,8]};
let ov=[],octave=0;
function chord(i){
 const sc=+$('scale').value?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
 const third=(sc[(i+2)%7]-sc[i]+12)%12,fifth=(sc[(i+4)%7]-sc[i]+12)%12;
 const o=ov[i]||{};
 const off=o.root??sc[i];let q=o.type??(fifth===6?'dim':third===3?'m':'');
 const minor=/^(m(?!aj)|dim)/.test(q);
 if(variation==='flip')q=minor?'':'m';
 else if(variation==='7')q=q==='dim'?'m7♭5':minor?'m7':'7';
 else if(variation==='6')q=minor?'m6':'6';
 else if(variation!=='normal')q=variation;
 const k=+$('key').value,root=(k+off)%12,bass=o.bass==null?root:(k+o.bass)%12,shift=12*octave;
 return{name:N[root]+q+(bass!==root?'/'+N[bass]:''),notes:[36+bass+shift,...T[q].map(x=>48+root+x+shift)]}}
let voice=null,last=null,droneStops=[];
let tails=[],droneTail=[],droneId='';
function stop(){if(!voice)return;clearInterval(voice.timer);voice.stops.forEach(f=>f(ac.currentTime));
 tails.push(voice.stops);while(tails.length>1)tails.shift().forEach(f=>f.kill());voice=null;
 document.querySelectorAll('.pad').forEach(p=>p.classList.remove('on'))}
function play(i){
 init();stop();last=i;const c=chord(i),type=$('timbre').value,v={i,stops:[],timer:0};voice=v;
 if($('mode').value==='arp'){let s=0;const step=()=>{if(ac.state!=='running')return;const t=ac.currentTime,n=note(c.notes[1+s++%(c.notes.length-1)]+12,t,type,level()*1.3,.01);n(t+.15);v.stops.push(n);if(v.stops.length>3)v.stops.shift().kill()};step();v.timer=setInterval(step,30000/$('bpm').value)}
 else v.stops=c.notes.map((m,k)=>note(m,ac.currentTime+k*.018,type,level(),.03));
 $('now').textContent=c.name;$('pads').children[i].classList.add('on');
 if($('drone').getAttribute('aria-pressed')==='true')startDrone()}
function stopDrone(){droneTail.forEach(f=>f.kill());droneStops.forEach(f=>f(ac.currentTime));droneTail=droneStops;droneStops=[];droneId=''}
function startDrone(){const notes=chord(last??0).notes,id=notes.join();if(id===droneId)return;stopDrone();droneId=id;droneStops=chord(last??0).notes.map(m=>note(m,ac.currentTime,'triangle',.06,1.2))}
function labels(){stop();[...$('pads').children].forEach((p,i)=>p.innerHTML=chord(i).name+'<small>'+(i+1)+'</small>')}
N.forEach((n,i)=>$('key').add(new Option('Tom '+n,i)));
let finger=null,holdTimer=0,popPad=0,preview=0;
for(let i=0;i<7;i++){const b=document.createElement('button');b.className='pad';$('pads').append(b);
 b.onpointerdown=e=>{e.preventDefault();init();b.releasePointerCapture(e.pointerId);
  closePop();clearTimeout(holdTimer);if($('longOn').checked)holdTimer=setTimeout(()=>openPop(i),500);
  if($('mode').value==='latch'&&voice&&voice.i===i)return stop();finger=e.pointerId;play(i)};
 b.oncontextmenu=e=>e.preventDefault();
 b.onclick=e=>{if(e.detail===0){voice&&voice.i===i?stop():play(i)}}}
addEventListener('pointerup',()=>{if(ac&&ac.state!=='running')ac.resume()});
const release=e=>{if(e.pointerId===finger){clearTimeout(holdTimer);finger=null;if($('mode').value!=='latch')stop()}};
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(!e.repeat&&e.key>='1'&&e.key<='7')play(e.key-1)});
addEventListener('keyup',e=>{if(e.key>='1'&&e.key<='7'&&$('mode').value!=='latch')stop()});
const DIRS=['flip','7','maj7','add9','sus4','6','dim','aug'];
function setVar(v){if(v===variation)return;variation=v;
 const n=DIRS.indexOf(v),a=n*Math.PI/4;$('knob').style.transform=n<0?'none':`translate(${Math.sin(a)*26}px,${-Math.cos(a)*26}px)`;
 if(voice)play(voice.i);else $('now').textContent=chord(last??0).name;if(droneStops.length)startDrone()}
const joy=$('joy');let jid=null;
function move(e){if(e.pointerId!==jid)return;const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
 setVar(Math.hypot(x,y)<18?'normal':DIRS[(Math.round(Math.atan2(x,-y)/(Math.PI/4))+8)%8])}
joy.onpointerdown=e=>{e.preventDefault();clearTimeout(holdTimer);closePop();init();jid=e.pointerId;joy.setPointerCapture(jid);move(e)};
joy.onpointermove=move;
joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;setVar('normal')}};
const ARROW={ArrowUp:'flip',ArrowRight:'maj7',ArrowDown:'sus4',ArrowLeft:'dim'};
joy.onkeydown=e=>{if(ARROW[e.key]){e.preventDefault();init();setVar(ARROW[e.key])}};
joy.onkeyup=e=>{if(ARROW[e.key])setVar('normal')};
['key','scale','mode','timbre'].forEach(i=>$(i).onchange=()=>{labels();$('now').textContent=chord(last??0).name;$('sound').textContent=$('timbre').selectedOptions[0].text;if(droneStops.length)startDrone()});
function toggle(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);return on}
$('drone').onclick=e=>{init();toggle(e.currentTarget)?startDrone():stopDrone()};
function hiss(t,dur,type,f,vol,dest){
 const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;fl.type=type;fl.frequency.value=f;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*3,dur)}
function tone(t,a,z,dur,vol,dest){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(z,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur)}
let beatTimer=0,step=0,next=0;
$('beat').onclick=e=>{init();clearInterval(beatTimer);if(!toggle(e.currentTarget))return;step=0;next=ac.currentTime+.05;
 beatTimer=setInterval(()=>{if(next<ac.currentTime)next=ac.currentTime+.05;
  while(next<ac.currentTime+.15){const s=step%8;
   if(s===0||s===5)tone(next,140,45,.22,.7,master);
   if(s===2||s===6)hiss(next,.18,'bandpass',1700,.45,master);
   hiss(next,.05,'highpass',7000,s%2?.09:.18,master);
   next+=30/$('bpm').value*(s%2?.86:1.14);step++}},25)};

  s.buffer=noise;s.loop=true;fl.type=type;fl.frequency.value=f;g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(texBus);s.start();
  let l=null;if(!fn){g.gain.value=.2;l=ac.createOscillator();const a=ac.createGain();l.frequency.value=.12;a.gain.value=.17;l.connect(a);a.connect(g.gain);l.start()}
  live[name]={s,l,t:fn?setInterval(()=>ac.state==='running'&&fn(),ms):0}}});
